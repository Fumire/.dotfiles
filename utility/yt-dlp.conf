# First try the best separate video and audio streams with a video that is not
# labelled Premium. Include videos without format_note and retain a fallback.
--format "bv[format_note!*=?Premium]+ba/b"

# Prefer H.264/AAC formats and merge or remux to MP4 when supported.
-t mp4

# Retry transient failures with bounded exponential backoff.
--retries 10
--fragment-retries 10
--retry-sleep "http:exp=1:20"
--retry-sleep "fragment:exp=1:20"

# Embed cover art, metadata/chapters, and manual subtitles except live chat.
--embed-thumbnail
--embed-metadata
--embed-subs
--sub-langs "all,-live_chat"
